<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PingHub — Smart Notification System for students. Track placements, results, and campus events in real time." />
    <meta name="theme-color" content="#F0F2FF" />

    <title>PingHub — Smart Notification System</title>

    <!-- Inter font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Prevent FOUC — apply dark background immediately */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #F0F2FF;
        color: #111827;
      }

      #root {
        min-height: 100vh;
      }

      /* Initial loading spinner before React mounts */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #080D1A;
        z-index: 9999;
        flex-direction: column;
        gap: 16px;
        transition: opacity 0.3s ease;
      }

      #app-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loader-ring {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid rgba(99,102,241,0.15);
        border-top-color: #6366F1;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loader-text {
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        color: #9CA3AF;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="app-loader" aria-label="Loading PingHub">
      <div class="loader-ring"></div>
      <span class="loader-text">Loading…</span>
    </div>

    <div id="root"></div>

    <script>
      // Hide the loader once React has rendered
      window.addEventListener('load', () => {
        const loader = document.getElementById('app-loader');
        if (loader) {
          setTimeout(() => loader.classList.add('hidden'), 300);
        }
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
